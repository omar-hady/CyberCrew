# Decap CMS — CyberCrew
#
# Local development: keep `local_backend` + run `npm run cms` alongside `npm run dev`
# (not preview). On localhost/127.0.0.1 Decap uses the local proxy and ignores remote
# OAuth. Docs: https://decapcms.org/docs/decap-proxy/
#
# Production: GitHub backend + self-hosted Cloudflare Worker OAuth proxy
# (Decap Turbo is unreachable from some environments). Official guide:
# https://decapcms.org/docs/backends-overview/#using-github-with-an-oauth-proxy
# Worker template: https://github.com/sterlingwes/decap-proxy
# This repo’s Worker: workers/decap-oauth/
#
# Before production login works you must:
# 1. Deploy workers/decap-oauth and note PROXY_URL (no trailing slash)
# 2. Create a GitHub OAuth App with callback {PROXY_URL}/callback
# 3. Set Worker secrets GITHUB_OAUTH_ID / GITHUB_OAUTH_SECRET
# 4. Set OAUTH_ALLOWED_ORIGINS to this site’s production origin(s)
# 5. Replace REPLACE_WITH_WORKER_ORIGIN below with PROXY_URL and redeploy the site

# Local: when the admin UI is opened on localhost/127.0.0.1 and `npm run cms`
# is running, Decap talks to this proxy (no auth). Production ignores this block
# unless you are on those hosts.
local_backend:
  url: http://localhost:8081/api/v1
  allowed_hosts:
    - localhost
    - 127.0.0.1

# Production GitHub backend (OAuth via Cloudflare Worker).
# Localhost still uses local_backend / decap-server when `npm run cms` is running.
backend:
  name: github
  repo: omar-hady/CyberCrew
  branch: main
  # PROXY_URL only — no path, no trailing slash. Example after deploy:
  #   https://cybercrew-decap-oauth.<account>.workers.dev
  #   or https://decap.your-domain.example
  base_url: https://cybercrew-decap-oauth.cybercrew-community.workers.dev
  auth_endpoint: auth

# --- Optional: Decap Turbo (only if Turbo becomes reachable again) ---
# backend:
#   name: turbo-github
#   turbo_site_id: PASTE_REAL_UUID_FROM_TURBO_OVERVIEW
#   branch: main

# Media uploaded here is committed to the repo and is PUBLIC on static hosts.
# Paths are relative to the repository root (not the collection folder).
media_folder: public/uploads/resources
public_folder: /uploads/resources

# Set these to your production origin when known (no trailing slash).
# site_url: https://your-domain.example
# display_url: https://your-domain.example

logo_url: /brand/logo-horizontal-on-light.webp

# Simple publishing: editors push straight to the content branch.
publish_mode: simple

collections:
  - name: resources
    label: Resources
    label_singular: Resource
    folder: src/content/resources
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text }
      - label: Learning path
        name: track
        widget: relation
        collection: tracks
        search_fields: [title, short, pathId]
        value_field: "{{slug}}"
        display_fields: [title]
        options_length: 50
        hint: Tags the resource for library filters (uses the path’s slug/ID). New Learning Paths appear here automatically. To place a resource inside a path stage, also attach it under Learning Paths → Stages → Resources. Deleting a path does not delete library resources.
      - label: Difficulty
        name: difficulty
        widget: select
        options: [beginner, intermediate, advanced]
      - label: Resource type
        name: type
        widget: select
        options:
          - { label: PDF, value: pdf }
          - { label: Documentation, value: documentation }
          - { label: External reference, value: external }
          - { label: Lab, value: lab }
          - { label: Cheatsheet, value: cheatsheet }
          - { label: Session materials, value: session }
      - { label: Tags, name: tags, widget: list, required: false }
      - label: External URL
        name: url
        widget: string
        required: false
        hint: Use for documentation/external links. Prefer https URLs.
      - label: File
        name: file
        widget: file
        required: false
        # Leading slash = repo-root absolute. Without it, Decap treats the path as
        # relative to the collection folder and writes under src/content/resources/.
        media_folder: /public/uploads/resources
        public_folder: /uploads/resources
        hint: Uploaded files in a public repo are publicly downloadable.
      - label: Thumbnail
        name: thumbnail
        widget: image
        required: false
        media_folder: /public/uploads/resources
        public_folder: /uploads/resources
      - { label: Featured, name: featured, widget: boolean, default: false }
      - { label: Published, name: published, widget: boolean, default: true }
      # Day.js tokens; default now so Astro's required pubDate is never empty.
      - label: Publication date
        name: pubDate
        widget: datetime
        default: "{{now}}"
        format: YYYY-MM-DDTHH:mm:ss.SSSZ
        picker_utc: true
      - { label: Order / priority, name: order, widget: number, default: 100, value_type: int }
      - { label: Body, name: body, widget: markdown, required: false }

  - name: announcements
    label: Announcements
    label_singular: Announcement
    folder: src/content/announcements
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Summary, name: summary, widget: text }
      - label: Date
        name: date
        widget: datetime
        default: "{{now}}"
        format: YYYY-MM-DDTHH:mm:ss.SSSZ
        picker_utc: true
      - label: Kind
        name: kind
        widget: select
        options: [announcement, workshop, session, contribution]
      - { label: Published, name: published, widget: boolean, default: true }
      - { label: Link, name: link, widget: string, required: false }
      - { label: Body, name: body, widget: markdown, required: false }

  - name: tracks
    label: Learning Paths
    label_singular: Learning Path
    folder: src/content/tracks
    create: true
    delete: true
    slug: "{{fields.pathId}}"
    extension: md
    format: frontmatter
    identifier_field: pathId
    summary: "{{title}} — {{journeyLevel}} / {{focus}}"
    sortable_fields: [order, title, journeyLevel, focus]
    description: >-
      Full learning-path entries (Markdown). Create adds a new path file; Delete removes
      only that path file (library Resources are kept). Set Order so the hub journey sorts
      correctly. Path ID becomes the public URL slug (/tracks/<path-id>).
    fields:
      - label: Path ID
        name: pathId
        widget: string
        pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', "Use lowercase letters, numbers, and hyphens only (e.g. web-security-basics)"]
        hint: Unique URL slug and filename. Set carefully on create — changing it renames /tracks/<id> and can break bookmarks or resource tags that still point at the old ID.
      - { label: Title, name: title, widget: string }
      - { label: Short description, name: short, widget: text }
      - { label: Level label, name: level, widget: string }
      - label: Order
        name: order
        widget: number
        value_type: int
        default: 100
        hint: Lower numbers appear first on the website journey (Foundations → Core → specializations). Use gaps (10, 20, 30…) so new paths can be inserted cleanly.
      - label: Journey level
        name: journeyLevel
        widget: select
        options:
          - { label: Foundations, value: foundations }
          - { label: Core skills, value: core }
          - { label: Specialization, value: specialization }
        hint: Controls where this path sits in Foundations → Core → Specialize on the hub page.
      - label: Focus
        name: focus
        widget: select
        options:
          - { label: Red Team, value: red-team }
          - { label: Blue Team, value: blue-team }
          - { label: CTF, value: ctf }
          - { label: Specialized / shared, value: specialized }
        hint: Specialization badge (Red / Blue / CTF). Use Specialized for Foundations, Core, and optional depth paths like Malware.
      - label: Objectives
        name: objectives
        widget: list
      - label: Stages
        name: stages
        widget: list
        summary: "{{fields.title}}"
        hint: Ordered learning stages. Attach CyberCrew library Resources by slug. Use Suggestions for external recommendations (CS50, MDN, etc.). Removing a stage or path does not delete the linked Resources.
        fields:
          - label: Stage ID
            name: id
            widget: string
            pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', "Use lowercase letters, numbers, and hyphens only"]
            hint: Stable URL anchor slug (lowercase, hyphens). Example — foundations-and-ethics
          - { label: Title, name: title, widget: string }
          - { label: Description, name: description, widget: text }
          - label: Importance
            name: importance
            widget: select
            options:
              - { label: Essential, value: essential }
              - { label: Optional, value: optional }
            default: essential
            hint: Use Optional for background topics learners can skip if they already have that foundation.
          - label: CyberCrew resources
            name: resources
            widget: relation
            collection: resources
            multiple: true
            required: false
            search_fields: [title, description]
            value_field: "{{slug}}"
            display_fields: [title]
            hint: Pick published library resources for this stage. Leave empty if content is still forthcoming. These are references only — deleting this path will not delete these resources.
          - label: External suggestions
            name: suggestions
            widget: list
            required: false
            summary: "{{fields.title}}"
            hint: External recommendations that are NOT CyberCrew resources. Always clarify that in the note.
            fields:
              - { label: Title, name: title, widget: string }
              - label: URL
                name: url
                widget: string
                required: false
                hint: Prefer https URLs to well-known public materials.
              - label: Note
                name: note
                widget: text
                required: false
                hint: e.g. Suggested external course — not a CyberCrew resource.
      - { label: Tools, name: tools, widget: list, required: false }
      - { label: Body, name: body, widget: markdown, required: false }

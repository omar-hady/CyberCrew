# Decap CMS — CyberCrew
#
# Local development: keep `local_backend` + run `npm run cms` alongside `npm run dev`
# (not preview). On localhost/127.0.0.1 Decap uses the local proxy and ignores remote
# OAuth. Docs: https://decapcms.org/docs/decap-proxy/
#
# Production: GitHub backend + self-hosted Cloudflare Worker OAuth proxy
# (Decap Turbo is unreachable from some environments). Official guide:
# https://decapcms.org/docs/backends-overview/#using-github-with-an-oauth-proxy
# Worker template: https://github.com/sterlingwes/decap-proxy
# This repo’s Worker: workers/decap-oauth/
#
# Before production login works you must:
# 1. Deploy workers/decap-oauth and note PROXY_URL (no trailing slash)
# 2. Create a GitHub OAuth App with callback {PROXY_URL}/callback
# 3. Set Worker secrets GITHUB_OAUTH_ID / GITHUB_OAUTH_SECRET
# 4. Set OAUTH_ALLOWED_ORIGINS to this site’s production origin(s)
# 5. Replace REPLACE_WITH_WORKER_ORIGIN below with PROXY_URL and redeploy the site

# Local: when the admin UI is opened on localhost/127.0.0.1 and `npm run cms`
# is running, Decap talks to this proxy (no auth). Production ignores this block
# unless you are on those hosts.
local_backend:
  url: http://localhost:8081/api/v1
  allowed_hosts:
    - localhost
    - 127.0.0.1

# Production GitHub backend (OAuth via Cloudflare Worker).
# Localhost still uses local_backend / decap-server when `npm run cms` is running.
backend:
  name: github
  repo: omar-hady/CyberCrew
  branch: main
  # PROXY_URL only — no path, no trailing slash. Example after deploy:
  #   https://cybercrew-decap-oauth.<account>.workers.dev
  #   or https://decap.your-domain.example
  base_url: https://cybercrew-decap-oauth.cybercrew-community.workers.dev
  auth_endpoint: auth

# --- Optional: Decap Turbo (only if Turbo becomes reachable again) ---
# backend:
#   name: turbo-github
#   turbo_site_id: PASTE_REAL_UUID_FROM_TURBO_OVERVIEW
#   branch: main

# Media uploaded here is committed to the repo and is PUBLIC on static hosts.
# Paths are relative to the repository root (not the collection folder).
media_folder: public/uploads/resources
public_folder: /uploads/resources

# Set these to your production origin when known (no trailing slash).
# site_url: https://your-domain.example
# display_url: https://your-domain.example

logo_url: /brand/logo-horizontal-on-light.webp

# Simple publishing: editors push straight to the content branch.
publish_mode: simple

collections:
  - name: resources
    label: Resources
    label_singular: Resource
    folder: src/content/resources
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text }
      - label: Learning track
        name: track
        widget: select
        options:
          - { label: Penetration Testing, value: penetration-testing }
          - { label: "SOC & Blue Team", value: soc-blue-team }
          - { label: Malware Analysis, value: malware-analysis }
          - { label: CTF Learning, value: ctf-learning }
          - { label: General, value: general }
      - label: Difficulty
        name: difficulty
        widget: select
        options: [beginner, intermediate, advanced]
      - label: Resource type
        name: type
        widget: select
        options:
          - { label: PDF, value: pdf }
          - { label: Documentation, value: documentation }
          - { label: External reference, value: external }
          - { label: Lab, value: lab }
          - { label: Cheatsheet, value: cheatsheet }
          - { label: Session materials, value: session }
      - { label: Tags, name: tags, widget: list, required: false }
      - label: External URL
        name: url
        widget: string
        required: false
        hint: Use for documentation/external links. Prefer https URLs.
      - label: File
        name: file
        widget: file
        required: false
        # Leading slash = repo-root absolute. Without it, Decap treats the path as
        # relative to the collection folder and writes under src/content/resources/.
        media_folder: /public/uploads/resources
        public_folder: /uploads/resources
        hint: Uploaded files in a public repo are publicly downloadable.
      - label: Thumbnail
        name: thumbnail
        widget: image
        required: false
        media_folder: /public/uploads/resources
        public_folder: /uploads/resources
      - { label: Featured, name: featured, widget: boolean, default: false }
      - { label: Published, name: published, widget: boolean, default: true }
      # Day.js tokens; default now so Astro's required pubDate is never empty.
      - label: Publication date
        name: pubDate
        widget: datetime
        default: "{{now}}"
        format: YYYY-MM-DDTHH:mm:ss.SSSZ
        picker_utc: true
      - { label: Order / priority, name: order, widget: number, default: 100, value_type: int }
      - { label: Body, name: body, widget: markdown, required: false }

  - name: announcements
    label: Announcements
    label_singular: Announcement
    folder: src/content/announcements
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Summary, name: summary, widget: text }
      - label: Date
        name: date
        widget: datetime
        default: "{{now}}"
        format: YYYY-MM-DDTHH:mm:ss.SSSZ
        picker_utc: true
      - label: Kind
        name: kind
        widget: select
        options: [announcement, workshop, session, contribution]
      - { label: Published, name: published, widget: boolean, default: true }
      - { label: Link, name: link, widget: string, required: false }
      - { label: Body, name: body, widget: markdown, required: false }

  - name: tracks
    label: Tracks
    label_singular: Track
    folder: src/content/tracks
    create: false
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Short description, name: short, widget: text }
      - { label: Level label, name: level, widget: string }
      - { label: Order, name: order, widget: number, value_type: int }
      - label: Objectives
        name: objectives
        widget: list
      - label: Roadmap
        name: roadmap
        widget: list
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Description, name: description, widget: text }
      - { label: Tools, name: tools, widget: list, required: false }
      - { label: Body, name: body, widget: markdown, required: false }

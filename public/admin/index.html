<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <!-- Ensures ./config.yml resolves when the page is opened as /admin (no trailing slash). -->
    <base href="/admin/" />
    <title>CyberCrew Content Admin</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="theme-color" content="#020202" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #020202;
        color: #efe6e6;
        font-family: "IBM Plex Sans", system-ui, sans-serif;
      }
      .boot {
        max-width: 40rem;
        margin: 4rem auto;
        padding: 1.5rem;
        border: 1px solid #2a1616;
      }
      .boot code {
        color: #ee2227;
      }
      .boot p {
        line-height: 1.55;
      }
      .boot a {
        color: #ff3a3f;
      }
    </style>
  </head>
  <body>
    <noscript>
      <div class="boot">
        <p>JavaScript is required for Decap CMS.</p>
      </div>
    </noscript>
    <!--
      Production auth: Decap Turbo (turbo-github). Set turbo_site_id in config.yml
      to the real Site ID UUID from the Turbo dashboard — do not invent it.
      Local editing: run `npm run cms` with `npm run dev` (local_backend: true).
      Docs: https://decapcms.org/docs/turbo-getting-started/
    -->
    <!-- Pin Decap CMS 3.17+ (required for turbo-github). -->
    <script src="https://cdn.jsdelivr.net/npm/decap-cms@3.17.3/dist/decap-cms.js"></script>
  </body>
</html>

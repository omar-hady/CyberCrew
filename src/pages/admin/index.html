<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <!-- Trailing-slash base so relative assets resolve under /admin/. -->
    <base href="/admin/" />
    <!-- Explicit config URL (config.yml lives in public/admin/). -->
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
    <title>CyberCrew Content Admin</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="theme-color" content="#020202" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #020202;
        color: #efe6e6;
        font-family: "IBM Plex Sans", system-ui, sans-serif;
      }
      .boot {
        max-width: 40rem;
        margin: 4rem auto;
        padding: 1.5rem;
        border: 1px solid #2a1616;
      }
      .boot code {
        color: #ee2227;
      }
      .boot p {
        line-height: 1.55;
      }
      .boot a {
        color: #ff3a3f;
      }
    </style>
  </head>
  <body>
    <noscript>
      <div class="boot">
        <p>JavaScript is required for Decap CMS.</p>
      </div>
    </noscript>
    <!--
      Local workflow (required for CMS edits to appear on the site):
        1. Terminal A: npm run dev
        2. Terminal B: npm run cms
        3. Open http://localhost:4321/admin/ (trailing slash) and Login
      Use `astro dev`, not `astro preview` — preview serves a frozen dist/ build
      and will not pick up markdown written by the local CMS proxy.
      Production: GitHub backend + Cloudflare Worker OAuth proxy
      (workers/decap-oauth). Set backend.base_url to the Worker origin after deploy.
      Docs: https://decapcms.org/docs/decap-proxy/
            https://decapcms.org/docs/backends-overview/#using-github-with-an-oauth-proxy
      Auth: local proxy has no email/password. Production uses GitHub OAuth via the Worker.
    -->
    <!-- Pin Decap CMS 3.17+ (compatible with github + turbo-github backends). -->
    <script src="https://cdn.jsdelivr.net/npm/decap-cms@3.17.3/dist/decap-cms.js"></script>
  </body>
</html>
